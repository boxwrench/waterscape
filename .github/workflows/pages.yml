name: Browser checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install numpy scipy Pillow pytest
      - run: node --check renderer/explore.js
      - run: node --check river-pulse/renderer/hacienda.js
      - run: npm run check
      - run: node --test "pipeline/tests/*.test.mjs"
      - run: python -m pytest pipeline/tests -q
      - run: node pipeline/validate-bundles.mjs
      - run: python pipeline/build_river_registry.py --check
      - run: node pipeline/validate-river-packages.mjs
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - name: Install Chromium for River Pulse interface checks
        run: npx playwright install --with-deps chromium
      - name: Verify built River Pulse interface
        run: node scripts/verify-river-pulse.mjs
      - name: Upload River Pulse visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-pulse-visual-checks
          path: previews/river-pulse-ui
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
