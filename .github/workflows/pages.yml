name: Browser checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install numpy scipy Pillow pytest
      - run: node --check renderer/explore.js
      - run: node --check river-pulse/renderer/hacienda.js
      - run: npm run check
      - run: node --test "pipeline/tests/*.test.mjs"
      - run: python -m pytest pipeline/tests -q
      - run: node pipeline/validate-bundles.mjs
      - name: Build real Hacienda terrain for River Pulse draft
        if: hashFiles('river-pulse/data/russian_river/places/hacienda_bridge/source.json') != ''
        run: python pipeline/build_river_terrain.py river-pulse/data/russian_river/places/hacienda_bridge/source.json
      - name: Verify Hacienda terrain artifact
        if: hashFiles('river-pulse/data/russian_river/places/hacienda_bridge/source.json') != ''
        run: |
          test -s river-pulse/data/russian_river/places/hacienda_bridge/terrain.bin.gz
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('river-pulse/data/russian_river/places/hacienda_bridge/terrain.json')
          m = json.loads(p.read_text())
          assert m['schemaVersion'] == 'river-pulse-terrain-0.1'
          assert m['verticalDatum'] == 'NAVD88 metres (3DEP)'
          assert 'waterLevel' not in m
          print(f"Hacienda terrain {m['width']}x{m['height']} {m['crs']} {m['verticalDatum']}")
          PY
      - name: Build real Hacienda 3DHP hydrography for River Pulse draft
        if: hashFiles('river-pulse/data/russian_river/places/hacienda_bridge/source.json') != ''
        run: python pipeline/build_river_hydrography.py river-pulse/data/russian_river/places/hacienda_bridge/source.json
      - name: Verify Hacienda hydrography artifact
        if: hashFiles('river-pulse/data/russian_river/places/hacienda_bridge/source.json') != ''
        run: |
          test -s river-pulse/data/russian_river/places/hacienda_bridge/hydrography.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('river-pulse/data/russian_river/places/hacienda_bridge/hydrography.json')
          h = json.loads(p.read_text())
          assert h['schemaVersion'] == 'river-pulse-hydrography-0.1'
          assert h['source'].startswith('U.S. Geological Survey 3D Hydrography Program')
          assert len(h['features']) > 0
          names = sorted({f['name'] for f in h['features'] if f.get('name')})
          print(f"Hacienda 3DHP flowlines: {len(h['features'])}; names: {', '.join(names[:12]) or '(unnamed)'}")
          PY
      - run: npm run build
      - name: Install Chromium for River Pulse interface checks
        run: npx playwright install --with-deps chromium
      - name: Verify built River Pulse interface
        run: node scripts/verify-river-pulse.mjs
      - name: Upload River Pulse visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-pulse-visual-checks
          path: previews/river-pulse-ui
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
