# BlueMap core settings for the Waterscape web map (render_map.sh copies this folder to its work dir).
# accept-download: BlueMap downloads Minecraft's own client jar from Mojang to read the vanilla textures.
accept-download: true
data: "data"
render-thread-count: 8
# Reads datapacks from the world folder, so the Sierra biome colours show on the map.
scan-for-mod-resources: true
# No anonymous usage reports.
metrics: false
log: {
  file: "data/logs/debug.log"
  append: false
}
