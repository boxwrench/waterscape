# The Hetch Hetchy map. render_map.sh replaces @WORLD@ with the relit world copy.
world: "@WORLD@"
dimension: "minecraft:overworld"
name: "Hetch Hetchy"
sorting: 0
# Opens over O'Shaughnessy Dam.
start-pos: { x: 577, z: 1355 }
# Sky from pack/biome_colours.json; the same colour past the map edge instead of black.
sky-color: "#6c9ee6"
void-color: "#6c9ee6"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
# Only the built area (chunks 0..161 x 0..118). Lighting the edge makes the game start
# generating chunks just outside it; those are not part of the map.
render-mask: [
  {
    min-x: 0
    max-x: 2591
    min-z: 0
    max-z: 1903
  }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
# Chunks without light data are skipped; render_map.sh lights them all first.
ignore-missing-light-data: false

# Places, at the hikers' spots (prototype/plan_animals.py HIKERS).
marker-sets: {
  places: {
    label: "Places"
    toggleable: true
    default-hidden: false
    markers: {
      dam: {
        type: "poi"
        position: { x: 577, y: 86, z: 1355 }
        label: "O'Shaughnessy Dam"
        max-distance: 1500
      }
      tunnel-south: {
        type: "poi"
        position: { x: 525, y: 88, z: 1304 }
        label: "Trail tunnel (dam end)"
        max-distance: 1500
      }
      tunnel-north: {
        type: "poi"
        position: { x: 499, y: 84, z: 1203 }
        label: "Trail tunnel (far end)"
        max-distance: 1500
      }
      trail: {
        type: "poi"
        position: { x: 519, y: 85, z: 1162 }
        label: "Hiking trail"
        max-distance: 1500
      }
      dock: {
        type: "poi"
        position: { x: 737, y: 81, z: 1373 }
        label: "Fishing dock"
        max-distance: 1500
      }
      ramp: {
        type: "poi"
        position: { x: 716, y: 83, z: 1389 }
        label: "Boat ramp"
        max-distance: 1500
      }
    }
  }
}
