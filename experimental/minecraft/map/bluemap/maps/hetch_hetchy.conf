# The Hetch Hetchy map. render_map.sh replaces @WORLD@ with the relit world copy.
world: "@WORLD@"
dimension: "minecraft:overworld"
name: "Hetch Hetchy"
sorting: 0
# Opens over O'Shaughnessy Dam.
start-pos: { x: 577, z: 1355 }
# Sky from pack/biome_colours.json; the same colour past the map edge instead of black.
sky-color: "#6c9ee6"
void-color: "#6c9ee6"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: 55
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
# Only the built area (chunks 0..161 x 0..118). Lighting the edge makes the game start
# generating chunks just outside it; those are not part of the map.
render-mask: [
  {
    min-x: 0
    max-x: 2591
    min-z: 0
    max-z: 1903
  }
]
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
# Chunks without light data are skipped; render_map.sh lights them all first.
ignore-missing-light-data: false

# No place pins: the description panel (waterscape.js) explains the map instead.
marker-sets: {
}
