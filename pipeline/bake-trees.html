<!doctype html>
<!-- Tree bake page (pipeline only, never shipped): pipeline/bake-trees.mjs opens it in Edge,
     calls window.bake(variants) and window.impostors(...) and writes the results to the biome. -->
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "../vendor/three/three.webgpu.js",
          "three/tsl": "../vendor/three/three.tsl.js",
          "ez-tree": "../node_modules/@dgreenheck/ez-tree/build/ez-tree.es.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { normalWorld, texture, uv } from "three/tsl";
      import { Tree } from "ez-tree";
      // Deep-merge plain objects so a variant only lists the options it changes.
      const merge = (target, patch) => {
        for (const [k, v] of Object.entries(patch ?? {}))
          if (v && typeof v === "object" && !Array.isArray(v)) merge((target[k] ??= {}), v);
          else target[k] = v;
        return target;
      };
      const pack = (geometry) => ({
        position: Array.from(geometry.attributes.position.array),
        normal: Array.from(geometry.attributes.normal.array),
        uv: Array.from(geometry.attributes.uv.array),
        index: Array.from(geometry.index.array),
      });
      const imageSrc = (map) => map?.image?.src ?? null;
      const trees = {};
      window.bake = async (variants) => {
        const out = { variants: [], textures: {} };
        for (const v of variants) {
          const tree = new Tree();
          tree.loadPreset(v.preset);
          merge(tree.options, v.options);
          tree.options.seed = v.seed;
          tree.generate();
          trees[v.id] = tree;
          const box = new THREE.Box3().setFromObject(tree.leavesMesh);
          out.variants.push({
            id: v.id,
            branches: pack(tree.branchesMesh.geometry),
            leaves: pack(tree.leavesMesh.geometry),
            height: box.max.y,
            crownRadius: Math.max(box.max.x - box.min.x, box.max.z - box.min.z) / 2,
            crownCentre: [(box.max.x + box.min.x) / 2, (box.max.z + box.min.z) / 2],
          });
          out.textures.bark ??= imageSrc(tree.branchesMesh.material.map);
          out.textures.barkNormal ??= imageSrc(tree.branchesMesh.material.normalMap);
          out.textures.leaf ??= imageSrc(tree.leavesMesh.material.map);
        }
        return out;
      };

      // Impostor sheets: each tree photographed from `frames` directions around it, `elevation`
      // radians above the horizon, into one row per tree of an albedo sheet (sRGB, alpha = cover)
      // and a world-normal sheet (normal * 0.5 + 0.5). Leaves carry their species tint.
      window.impostors = async (ids, { frames, size, elevation, tints }) => {
        const canvas = document.createElement("canvas"),
          renderer = new THREE.WebGPURenderer({ canvas, antialias: false });
        await renderer.init();
        renderer.setClearColor(0x000000, 0);
        const target = new THREE.RenderTarget(size, size, { samples: 4 }),
          sheets = { albedo: document.createElement("canvas"), normal: document.createElement("canvas") },
          rows = [];
        for (const s of Object.values(sheets)) {
          s.width = size * frames;
          s.height = size * ids.length;
        }
        const ctx = { albedo: sheets.albedo.getContext("2d"), normal: sheets.normal.getContext("2d") };
        for (const [row, id] of ids.entries()) {
          const tree = trees[id],
            leafMap = tree.leavesMesh.material.map,
            barkMap = tree.branchesMesh.material.map,
            tint = new THREE.Color(...tints[row]),
            box = new THREE.Box3().setFromObject(tree),
            half = Math.max(box.max.x - box.min.x, box.max.z - box.min.z) / 2,
            minY = Math.min(0, box.min.y),
            tall = box.max.y - minY,
            // A square frame big enough for the tree seen from `elevation` above (its projected
            // height grows by the crown's depth times sin(elevation)).
            s = Math.max(half, (tall * Math.cos(elevation) + 2 * half * Math.sin(elevation)) / 2) * 1.06,
            centre = new THREE.Vector3((box.max.x + box.min.x) / 2, minY + tall / 2, (box.max.z + box.min.z) / 2),
            materials = {
              albedo: [
                new THREE.MeshBasicNodeMaterial({ map: barkMap }),
                new THREE.MeshBasicNodeMaterial({ map: leafMap, color: tint, side: THREE.DoubleSide, alphaTest: 0.5 }),
              ],
              normal: [
                Object.assign(new THREE.MeshBasicNodeMaterial(), { colorNode: normalWorld.mul(0.5).add(0.5) }),
                Object.assign(new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide, alphaTest: 0.5 }), {
                  colorNode: normalWorld.mul(0.5).add(0.5),
                  opacityNode: texture(leafMap, uv()).a,
                }),
              ],
            },
            scene = new THREE.Scene(),
            branches = new THREE.Mesh(tree.branchesMesh.geometry),
            leaves = new THREE.Mesh(tree.leavesMesh.geometry);
          scene.add(branches, leaves);
          const camera = new THREE.OrthographicCamera(-s, s, s, -s, 0.1, s * 20);
          for (const kind of ["albedo", "normal"]) {
            branches.material = materials[kind][0];
            leaves.material = materials[kind][1];
            for (let f = 0; f < frames; f++) {
              // Frame f looks at the tree from azimuth f/frames of a turn (the tree's own +x at 0).
              const a = (f / frames) * Math.PI * 2,
                dir = new THREE.Vector3(Math.cos(a) * Math.cos(elevation), Math.sin(elevation), Math.sin(a) * Math.cos(elevation));
              camera.position.copy(centre).addScaledVector(dir, s * 8);
              camera.lookAt(centre);
              renderer.setRenderTarget(target);
              renderer.clear();
              renderer.render(scene, camera);
              const px = await renderer.readRenderTargetPixelsAsync(target, 0, 0, size, size),
                image = ctx[kind].createImageData(size, size);
              // WebGPU render targets read back top-down and linear: encode albedo to sRGB.
              for (let y = 0; y < size; y++)
                for (let x = 0; x < size; x++) {
                  const i = (y * size + x) * 4,
                    o = i;
                  for (let c = 0; c < 3; c++)
                    image.data[o + c] =
                      kind === "albedo" ? Math.round(255 * Math.pow(px[i + c] / 255, 1 / 2.2)) : px[i + c];
                  image.data[o + 3] = px[i + 3];
                }
              ctx[kind].putImageData(image, f * size, row * size);
            }
          }
          // size: the frame's side in the tree's own units; centre: the frame centre (x, y, z)
          // relative to the trunk base.
          rows.push({ id, size: 2 * s, centre: [centre.x, centre.y, centre.z] });
        }
        return {
          albedo: sheets.albedo.toDataURL("image/png"),
          normal: sheets.normal.toDataURL("image/png"),
          rows,
        };
      };
      window.ready = true;
    </script>
  </body>
</html>
